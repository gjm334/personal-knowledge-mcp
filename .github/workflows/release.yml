name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Run regression and real MCP protocol tests
        run: python -m unittest discover -s tests -v
      - name: Build source-only archive and checksum
        run: python tools/build_release.py
      - name: Publish second version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '2.0.0') { throw 'Review the release version first' }
          gh release create "v$version" "dist/personal-knowledge-mcp-v$version.zip" "dist/personal-knowledge-mcp-v$version-SHA256SUMS.txt" --target "$env:GITHUB_SHA" --title "v$version - Project collaboration and interactive learning" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
